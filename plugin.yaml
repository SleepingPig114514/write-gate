name: write-gate
version: "1.1.1"
description: "Hermes Agent 桌面端插件：写操作确认闸门。拦截 write_file/patch/memory/execute_code（代码含写模式或状态变更）/terminal（命令命中状态变更黑名单，默认放行、命中才拦），锁定状态下发起被拦，模型呈现方案并调 Hermes 内置 clarify 出确认卡。点「按此方案执行」=本轮回复内全部写入静默（下一条消息自动重锁）；点「取消」机械判 NO 零开销；卡上自定义框由 auxiliary.approval 槽模型语义分类。无 clarify UI 的平台（oneshot/cron/qqbot/眼镜）与子代理自动豁免；插件故障 fail-open。"
author: custom
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_end
