name: write-gate
version: "1.1.7"
description: "Hermes Agent 桌面端插件：写操作确认闸门。拦截 write_file/patch/memory/execute_code（代码含写模式——含 open(...'r+') 读改模式、hermes_tools 程序化写助手、或状态变更）/terminal（命令命中状态变更黑名单，默认放行、命中才拦；匹配不区分大小写，含 PowerShell 写文件 cmdlet Set-Content/Out-File/Add-Content/Tee-Object/Set-ItemProperty；探查降级仅限包安装/包管理/hermes 自身/git 写操作四类，删除类永不降级），锁定状态下发起被拦，模型呈现方案并调 Hermes 内置 clarify 出确认卡。点「按此方案执行」=本轮回复内全部写入静默（下一条消息自动重锁）；点「取消」机械判 NO 零开销；卡上自定义框由 auxiliary.approval 槽模型语义分类。无 clarify UI 的平台（oneshot/cron/qqbot/眼镜）与子代理自动豁免；插件故障 fail-open。"
author: custom
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_end
config_schema:
  delegate_after_approval:
    type: boolean
    label: "确认后自动转派子代理"
    description: "开启后点「按此方案执行」不再由主模型执行，改为派给子代理；关闭 = 与现在行为完全一致"
    default: false
  delegate_min_lines:
    type: int
    label: "转派行数阈值"
    description: "改动行数低于此值直接写入、不派子代理（同轮多次写入会累加，累计越线后转派当次调用）；0 = 不设阈值（全部转派）。patch 按 new_string 行数，write_file 按真实改动量（≤2 MB 且能读到原文件时），execute_code/terminal 估不出始终转派"
    default: 0
